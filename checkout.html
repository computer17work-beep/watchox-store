<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | WATCHOX</title>
  <meta name="description" content="Complete your purchase securely at WATCHOX." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 992px) {
      .checkout-grid {
        grid-template-columns: 1fr 400px;
      }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--text-primary);
    }
    .payment-option {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 14px 18px;
      border-radius: 4px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .payment-option input[type="radio"] {
      accent-color: var(--text-primary);
    }
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 24px;
      border-radius: 4px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .summary-row.total {
      color: var(--text-primary);
      font-size: 1.2rem;
      font-weight: bold;
      border-top: 1px solid var(--border-dark);
      padding-top: 12px;
      margin-top: 12px;
    }
    .cart-item-row {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-dark);
    }
  </style>
</head>
<body>

  <!-- Header Rendered Dynamically -->
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Secure Checkout</h1>

      <!-- Free Delivery Tracker -->
      <div class="free-shipping-bar" id="checkout-shipping-bar">
        <div id="shipping-progress-text" style="font-size: 0.85rem; font-weight: bold;">Checking delivery qualification...</div>
        <div class="progress-track">
          <div class="progress-fill" id="shipping-progress-fill"></div>
        </div>
      </div>

      <div class="checkout-grid">
        <!-- Customer & Shipping Form -->
        <main>
          <form id="checkout-form" onsubmit="handlePlaceOrder(event)">
            <div style="background: var(--bg-card); border: 1px solid var(--border-dark); padding: 24px; border-radius: 4px; margin-bottom: 24px;">
              <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;">1. Shipping Details</h2>
              
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                  <label>Full Name *</label>
                  <input type="text" class="form-control" required id="cust-name" placeholder="John Doe" />
                </div>
                <div class="form-group">
                  <label>Phone Number *</label>
                  <input type="tel" class="form-control" required id="cust-phone" placeholder="01700000000" />
                </div>
              </div>

              <div class="form-group">
                <label>Email Address (Optional)</label>
                <input type="email" class="form-control" id="cust-email" placeholder="john@example.com" />
              </div>

              <div class="form-group">
                <label>Delivery Address *</label>
                <textarea class="form-control" rows="3" required id="cust-address" placeholder="House/Road, Area, City, District"></textarea>
              </div>

              <div class="form-group">
                <label>Order Notes (Optional)</label>
                <input type="text" class="form-control" id="cust-notes" placeholder="Special delivery instructions..." />
              </div>
            </div>

            <!-- Payment Method Selector -->
            <div style="background: var(--bg-card); border: 1px solid var(--border-dark); padding: 24px; border-radius: 4px;">
              <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;">2. Select Payment Method</h2>
              
              <label class="payment-option">
                <input type="radio" name="payment" value="cod" checked onchange="togglePaymentInstructions()" />
                <div>
                  <div style="font-weight: bold; font-size: 0.95rem;">Cash on Delivery (COD)</div>
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Pay in cash when your timepiece arrives.</div>
                </div>
              </label>

              <label class="payment-option">
                <input type="radio" name="payment" value="bkash" onchange="togglePaymentInstructions()" />
                <div>
                  <div style="font-weight: bold; font-size: 0.95rem;">bKash Online Payment</div>
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Direct digital payment gateway placeholder.</div>
                </div>
              </label>

              <label class="payment-option">
                <input type="radio" name="payment" value="card" onchange="togglePaymentInstructions()" />
                <div>
                  <div style="font-weight: bold; font-size: 0.95rem;">Credit / Debit Card</div>
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Visa, Mastercard, AMEX placeholder integration.</div>
                </div>
              </label>

              <div id="payment-instructions" style="margin-top: 12px; padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-dark); font-size: 0.85rem; color: var(--text-secondary);">
                Pay with cash upon delivery. Inspect your parcel before completing payment.
              </div>

              <button type="submit" class="btn-primary" style="margin-top: 24px; padding: 16px; font-size: 0.9rem;">Place Order Now</button>
            </div>
          </form>
        </main>

        <!-- Cart Summary & Coupon Section -->
        <aside>
          <div class="summary-card">
            <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;">Order Summary</h2>
            
            <div id="checkout-cart-items" style="max-height: 250px; overflow-y: auto; margin-bottom: 16px;">
              <!-- Injected dynamically -->
            </div>

            <!-- Coupon Input -->
            <div style="display: flex; gap: 8px; margin-bottom: 20px;">
              <input type="text" id="coupon-code-input" placeholder="Promo code (e.g. WATCH10)" class="form-control" style="text-transform: uppercase;" />
              <button class="btn-secondary" style="width: auto; padding: 0 16px;" onclick="applyPromoCode()">Apply</button>
            </div>
            <div id="applied-coupon-tag" style="display: none; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border: 1px solid var(--border-dark); margin-bottom: 16px; font-size: 0.85rem;">
              <span>Promo applied: <strong id="coupon-tag-name"></strong></span>
              <button onclick="removePromoCode()" style="color: #F44336;">✕</button>
            </div>

            <!-- Price Calculations -->
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="summary-subtotal">৳0</span>
            </div>
            <div class="summary-row">
              <span>Delivery Fee</span>
              <span id="summary-shipping">৳0</span>
            </div>
            <div class="summary-row" id="discount-row" style="display: none; color: #4CAF50;">
              <span>Discount</span>
              <span id="summary-discount">-৳0</span>
            </div>
            <div class="summary-row total">
              <span>Grand Total</span>
              <span id="summary-total">৳0</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCheckoutSummary();
      window.addEventListener("watchox:cart-updated", renderCheckoutSummary);
    });

    function renderCheckoutSummary() {
      const cart = StoreEngine.getCart();
      const container = document.getElementById("checkout-cart-items");

      if (cart.length === 0) {
        container.innerHTML = `<div style="color: var(--text-secondary); padding: 20px; text-align: center;">Your cart is empty. <a href="shop.html" style="color:#fff; text-decoration:underline;">Return to shop</a></div>`;
      } else {
        container.innerHTML = cart.map(item => {
          const product = PRODUCTS.find(p => p.id === item.id);
          if (!product) return '';
          return `
            <div class="cart-item-row">
              <img src="${product.images[0]}" style="width: 50px; height: 50px; object-fit: cover; border: 1px solid var(--border-dark);" />
              <div style="flex: 1;">
                <div style="font-size: 0.85rem; font-weight: bold;">${product.name}</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">${item.variant ? `Variant: ${item.variant} | ` : ''}Qty: ${item.quantity}</div>
                <div style="font-size: 0.85rem;">${WATCHOX_CONFIG.currency}${product.price * item.quantity}</div>
              </div>
              <button onclick="StoreEngine.removeFromCart('${item.id}', '${item.variant}')" style="color: var(--text-secondary); font-size: 0.9rem;">✕</button>
            </div>
          `;
        }).join('');
      }

      // Progress bar calculation
      const progress = StoreEngine.getFreeDeliveryProgress();
      const barFill = document.getElementById("shipping-progress-fill");
      const barText = document.getElementById("shipping-progress-text");

      barFill.style.width = `${progress.percentage}%`;
      if (progress.isUnlocked) {
        barText.textContent = `🎉 Congratulations! You unlocked FREE Delivery!`;
      } else {
        barText.textContent = `Add ${WATCHOX_CONFIG.currency}${progress.remaining} more to unlock FREE Delivery!`;
      }

      // Financials
      const subtotal = StoreEngine.getCartSubtotal();
      const shippingCost = progress.isUnlocked ? 0 : WATCHOX_CONFIG.defaultShippingCost;
      const discount = StoreEngine.calculateDiscount();
      const grandTotal = Math.max(0, subtotal + shippingCost - discount);

      document.getElementById("summary-subtotal").textContent = `${WATCHOX_CONFIG.currency}${subtotal}`;
      document.getElementById("summary-shipping").textContent = shippingCost === 0 ? "FREE" : `${WATCHOX_CONFIG.currency}${shippingCost}`;

      const discountRow = document.getElementById("discount-row");
      if (discount > 0) {
        discountRow.style.display = "flex";
        document.getElementById("summary-discount").textContent = `-${WATCHOX_CONFIG.currency}${discount}`;
      } else {
        discountRow.style.display = "none";
      }

      document.getElementById("summary-total").textContent = `${WATCHOX_CONFIG.currency}${grandTotal}`;

      // Coupon Tag
      const applied = StoreEngine.getAppliedCoupon();
      const tag = document.getElementById("applied-coupon-tag");
      if (applied) {
        tag.style.display = "flex";
        document.getElementById("coupon-tag-name").textContent = applied.code;
      } else {
        tag.style.display = "none";
      }
    }

    function togglePaymentInstructions() {
      const selected = document.querySelector('input[name="payment"]:checked').value;
      const box = document.getElementById("payment-instructions");
      if (selected === "cod") {
        box.textContent = "Pay with cash upon delivery. Inspect your parcel before completing payment.";
      } else if (selected === "bkash") {
        box.textContent = "bKash Payment Gateway Integration Placeholder. Order will mark as pending verification.";
      } else {
        box.textContent = "Credit/Debit Card Gateway Placeholder. SSLCommerz / Stripe readiness enabled.";
      }
    }

    function applyPromoCode() {
      const code = document.getElementById("coupon-code-input").value;
      if (!code) return;
      const res = StoreEngine.applyCoupon(code);
      AppEngine.showToast(res.message);
      if (res.success) document.getElementById("coupon-code-input").value = "";
    }

    function removePromoCode() {
      StoreEngine.removeCoupon();
      AppEngine.showToast("Coupon removed.");
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      if (StoreEngine.getCart().length === 0) {
        AppEngine.showToast("Your cart is empty!");
        return;
      }

      const orderId = "WX-" + Math.floor(100000 + Math.random() * 900000);
      const phone = document.getElementById("cust-phone").value;
      const name = document.getElementById("cust-name").value;

      // Save order metadata to demo storage
      const demoOrder = {
        orderId,
        name,
        phone,
        items: StoreEngine.getCart(),
        subtotal: StoreEngine.getCartSubtotal(),
        status: "Confirmed",
        date: new Date().toLocaleDateString()
      };
      localStorage.setItem("watchox_last_order", JSON.stringify(demoOrder));

      // Clear Cart
      StoreEngine.saveCart([]);

      // Redirect to Tracking Screen
      window.location.href = `track-order.html?orderId=${orderId}&phone=${encodeURIComponent(phone)}`;
    }
  </script>
</body>
</html>
