<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offers & Combos | WATCHOX</title>
  <meta name="description" content="Exclusive watch combo deals, promo coupons, and limited-time flash sales at WATCHOX." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .coupon-card {
      background: var(--bg-card);
      border: 1px dashed var(--border-dark);
      padding: 20px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }
    .coupon-card:hover {
      border-color: var(--text-primary);
    }
    .coupon-code {
      background: var(--bg-primary);
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Header Rendered Dynamically -->
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Offers & Savings Hub</h1>

      <!-- Active Coupons Section -->
      <div style="margin-bottom: 50px;">
        <h2 style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;">Active Store Coupons</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;" id="coupons-container">
          <!-- Injected Dynamically -->
        </div>
      </div>

      <!-- Flash Sale Section -->
      <div style="margin-bottom: 50px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h2 style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1.5px;">Flash Sale Deals</h2>
          <div style="font-size: 0.9rem; color: var(--text-secondary);">
            Ending in: <span id="offers-flash-timer" data-countdown="2026-12-31T23:59:59" style="color: #fff; font-weight: bold;">00:00:00</span>
          </div>
        </div>
        <div id="offers-flash-grid" class="product-grid"></div>
      </div>

      <!-- Combo Bundles Section -->
      <div id="combos">
        <h2 style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;">Exclusive Combo Bundles</h2>
        <div id="offers-combo-grid" class="product-grid"></div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCoupons();
      renderOfferGrids();
    });

    function renderCoupons() {
      const container = document.getElementById("coupons-container");
      container.innerHTML = Object.entries(COUPONS).map(([code, details]) => `
        <div class="coupon-card">
          <div>
            <div class="coupon-code">${code}</div>
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px;">
              ${details.type === 'percentage' ? `${details.value}% OFF` : details.type === 'fixed' ? `${WATCHOX_CONFIG.currency}${details.value} OFF` : 'Free Shipping'}
              (Min spend: ${WATCHOX_CONFIG.currency}${details.minSpend})
            </div>
          </div>
          <button class="btn-secondary" style="width: auto; font-size: 0.75rem;" onclick="copyCoupon('${code}')">Copy Code</button>
        </div>
      `).join('');
    }

    function copyCoupon(code) {
      navigator.clipboard.writeText(code);
      AppEngine.showToast(`Coupon code '${code}' copied!`);
    }

    function renderOfferGrids() {
      const flashItems = PRODUCTS.filter(p => p.isFlashSale);
      const comboItems = PRODUCTS.filter(p => p.isCombo);

      renderGrid("offers-flash-grid", flashItems);
      renderGrid("offers-combo-grid", comboItems);
    }

    function renderGrid(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = items.map(p => `
        <div class="product-card">
          ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
          <div class="card-img-wrap">
            <a href="product.html?id=${p.id}">
              <img src="${p.images[0]}" alt="${p.name}" loading="lazy" />
            </a>
          </div>
          <div class="card-info">
            <h3 class="card-title"><a href="product.html?id=${p.id}">${p.name}</a></h3>
            <div class="card-price-row">
              <span class="current-price">${WATCHOX_CONFIG.currency}${p.price}</span>
              ${p.previousPrice ? `<span class="prev-price">${WATCHOX_CONFIG.currency}${p.previousPrice}</span>` : ''}
            </div>
            <button class="btn-primary" onclick="handleAddToCart('${p.id}')">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function handleAddToCart(id) {
      if (StoreEngine.addToCart(id)) {
        AppEngine.showToast("Product added to cart!");
      }
    }
  </script>
</body>
</html>
