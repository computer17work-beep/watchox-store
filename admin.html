<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Admin Dashboard | WATCHOX</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="container" style="padding-top:40px;">
    <h1 class="section-title">WATCHOX Control Panel</h1>
    <div style="background:var(--bg-card); padding:20px; border:1px solid var(--border-dark);">
      <h2>Live Store Metrics</h2>
      <p style="margin-top:10px;">Total Products Loaded: <strong id="admin-prod-count">0</strong></p>
      <p style="margin-top:5px;">Recent Stored Order: <strong id="admin-last-order">None</strong></p>
    </div>
  </div>

  <script src="./js/data.js"></script>
  <script>
    document.getElementById("admin-prod-count").textContent = PRODUCTS.length;
    const lastOrder = JSON.parse(localStorage.getItem("watchox_last_order") || "null");
    if (lastOrder) {
      document.getElementById("admin-last-order").textContent = `${lastOrder.orderId} (${lastOrder.name})`;
    }
  </script>
</body>
</html>
