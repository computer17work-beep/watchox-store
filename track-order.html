<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | WATCHOX</title>
  <meta name="description" content="Track your WATCHOX order status in real-time." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .track-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 30px;
      border-radius: 4px;
      max-width: 700px;
      margin: 0 auto;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border-dark);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
    }
    .payment-tag {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid #4CAF50;
      font-size: 0.8rem;
      color: #4CAF50;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <!-- Header Rendered Dynamically -->
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Order Status & Tracking</h1>

      <!-- Order Lookup Input Form -->
      <div class="track-card" style="margin-bottom: 40px;">
        <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;">Track Your Shipment</h2>
        <form onsubmit="handleTrackSearch(event)" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px;">
          <input type="text" id="track-order-id" placeholder="Order ID (e.g. WX-123456)" required style="padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-dark); color: #fff;" />
          <input type="tel" id="track-phone" placeholder="Phone Number" required style="padding: 12px; background: var(--bg-primary); border: 1px solid var(--border-dark); color: #fff;" />
          <button type="submit" class="btn-primary" style="width: auto; padding: 0 24px;">Track</button>
        </form>
      </div>

      <!-- Result Container -->
      <div id="tracking-result-wrapper" style="display: none;">
        <div class="track-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
              <div style="font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Tracking Number</div>
              <h2 id="res-order-id" style="font-size: 1.4rem; font-weight: 800;">WX-000000</h2>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Placed by: <span id="res-name" style="color: #fff;"></span> (<span id="res-phone"></span>)</div>
            </div>
            <div>
              <span class="status-badge" id="res-status">Processing</span>
              <span class="payment-tag" id="res-payment-type">Cash On Delivery</span>
            </div>
          </div>

          <!-- Chronological Shipment Timeline -->
          <h3 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">Shipment Progress</h3>
          
          <div id="timeline-container">
            <!-- Timeline Injected Dynamically -->
          </div>

          <!-- Cash on Delivery Advisory Notice -->
          <div style="margin-top: 30px; padding: 16px; background: var(--bg-primary); border: 1px solid var(--border-dark); border-left: 3px solid #fff; font-size: 0.85rem; color: var(--text-secondary);">
            <strong style="color: #fff;">Cash on Delivery Notice:</strong> Please keep the exact payable amount ready in cash when the courier delivery agent arrives. Inspect the parcel before completing payment.
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("orderId");
      const phone = params.get("phone");

      if (orderId && phone) {
        document.getElementById("track-order-id").value = orderId;
        document.getElementById("track-phone").value = phone;
        fetchAndDisplayOrder(orderId, phone);
      } else {
        // Load recent order from local storage if exists
        const lastOrder = JSON.parse(localStorage.getItem("watchox_last_order") || "null");
        if (lastOrder) {
          fetchAndDisplayOrder(lastOrder.orderId, lastOrder.phone);
        }
      }
    });

    function handleTrackSearch(e) {
      e.preventDefault();
      const orderId = document.getElementById("track-order-id").value;
      const phone = document.getElementById("track-phone").value;
      fetchAndDisplayOrder(orderId, phone);
    }

    function fetchAndDisplayOrder(orderId, phone) {
      const wrapper = document.getElementById("tracking-result-wrapper");
      wrapper.style.display = "block";

      document.getElementById("res-order-id").textContent = orderId;
      document.getElementById("res-phone").textContent = phone;

      const lastOrder = JSON.parse(localStorage.getItem("watchox_last_order") || "null");
      if (lastOrder && lastOrder.orderId === orderId) {
        document.getElementById("res-name").textContent = lastOrder.name;
      } else {
        document.getElementById("res-name").textContent = "Valued Customer";
      }

      // Render Timeline
      const timelineEvents = [
        { title: "Order Confirmed & Placed", time: "Step 1 - Completed", done: true, desc: "Order details received. Processing for dispatch." },
        { title: "Quality Check & Packaging", time: "Step 2 - Completed", done: true, desc: "Timepiece inspected and packed securely." },
        { title: "Handed over to Courier", time: "Step 3 - In Transit", done: true, desc: "Package dispatched via express courier delivery." },
        { title: "Out for Cash on Delivery", time: "Step 4 - Pending", done: false, desc: "Rider will deliver the package to your address." }
      ];

      const timelineContainer = document.getElementById("timeline-container");
      timelineContainer.innerHTML = `
        <div style="border-left: 2px solid var(--border-dark); padding-left: 20px; margin-left: 10px;">
          ${timelineEvents.map(ev => `
            <div style="position: relative; margin-bottom: 24px;">
              <div style="position: absolute; left: -26px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: ${ev.done ? '#fff' : 'var(--border-dark)'}; border: 2px solid var(--bg-card);"></div>
              <div style="font-weight: bold; font-size: 0.9rem; color: ${ev.done ? '#fff' : 'var(--text-secondary)'};">${ev.title}</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary);">${ev.time}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">${ev.desc}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
