<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Your Wishlist | WATCHOX</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Your Saved Wishlist</h1>
      <div id="wishlist-grid" class="product-grid"></div>
    </div>
  </section>

  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/shop.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const wishlistIds = StoreEngine.getWishlist();
      const wishlistProducts = PRODUCTS.filter(p => wishlistIds.includes(p.id));
      ShopModule.renderCatalog(wishlistProducts, "wishlist-grid");
    });
  </script>
</body>
</html>
