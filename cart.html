<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Shopping Cart | WATCHOX</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Your Shopping Cart</h1>
      <div id="cart-page-items" style="margin-bottom: 30px;"></div>
      <div style="text-align: right;">
        <a href="checkout.html" class="btn-primary">Proceed to Checkout</a>
      </div>
    </div>
  </section>

  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCartTable();
    });

    function renderCartTable() {
      const cart = StoreEngine.getCart();
      const container = document.getElementById("cart-page-items");
      if (cart.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Your cart is currently empty.</p>";
        return;
      }
      container.innerHTML = cart.map(item => {
        const p = PRODUCTS.find(prod => prod.id === item.id);
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-dark); padding:15px 0;">
            <div>
              <h3>${p.name}</h3>
              <p>Qty: ${item.quantity}</p>
            </div>
            <div>
              <p>৳${p.price * item.quantity}</p>
              <button onclick="CartModule.removeItem('${item.id}', '${item.variant}')" style="color:red; background:none; border:none; cursor:pointer;">Remove</button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
