<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Shopping Cart | WATCHOX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-page {
            padding: 30px 0 60px;
        }
        .cart-item {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--lightgray);
            align-items: center;
        }
        .cart-item img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-details h4 {
            margin-bottom: 4px;
        }
        .cart-item-details .brand {
            color: var(--gray);
            font-size: 0.85rem;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .cart-item-actions button {
            background: var(--offwhite);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .cart-item-actions button:hover {
            background: var(--lightgray);
        }
        .cart-item-actions .remove-btn {
            color: #e74c3c;
            background: none;
            font-size: 0.85rem;
        }
        .cart-item-actions .remove-btn:hover {
            text-decoration: underline;
        }
        .cart-summary {
            background: var(--offwhite);
            border-radius: 16px;
            padding: 24px;
            position: sticky;
            top: 100px;
        }
        .cart-summary .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
        .cart-summary .total-row {
            border-top: 2px solid var(--border);
            padding-top: 16px;
            margin-top: 8px;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .coupon-input-group {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }
        .coupon-input-group input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 0;
        }
        .empty-cart i {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr !important;
            }
            .cart-item {
                flex-wrap: wrap;
            }
            .cart-item img {
                width: 80px;
                height: 80px;
            }
            .cart-summary {
                position: static;
            }
        }
    </style>
</head>
<body>
