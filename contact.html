<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | WATCHOX</title>
  <meta name="description" content="Get in touch with the WATCHOX customer support team for inquiries, support, or order assistance." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 992px) {
      .contact-grid {
        grid-template-columns: 1fr 360px;
      }
    }
    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 30px;
      border-radius: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-dark);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--text-primary);
    }
    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }
    .info-item div {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .info-item strong {
      display: block;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Header Rendered Dynamically -->
  <header id="main-header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Get In Touch</h1>

      <div class="contact-grid">
        <!-- Contact Form -->
        <main class="contact-card">
          <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">Send Us A Message</h2>
          <form id="contact-form" onsubmit="handleContactSubmit(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label>Your Name *</label>
                <input type="text" class="form-control" required placeholder="John Doe" />
              </div>
              <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" class="form-control" required placeholder="01700000000" />
              </div>
            </div>

            <div class="form-group">
              <label>Email Address</label>
              <input type="email" class="form-control" placeholder="john@example.com" />
            </div>

            <div class="form-group">
              <label>Subject</label>
              <select class="form-control">
                <option>General Inquiry</option>
                <option>Order Status Update</option>
                <option>Warranty & Support</option>
                <option>Bulk / Wholesale Order</option>
              </select>
            </div>

            <div class="form-group">
              <label>Message *</label>
              <textarea class="form-control" rows="5" required placeholder="How can we help you today?"></textarea>
            </div>

            <button type="submit" class="btn-primary" style="padding: 14px 28px; width: auto;">Submit Message</button>
          </form>
        </main>

        <!-- Contact Info Sidebar -->
        <aside class="contact-card">
          <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">Contact Information</h2>

          <div class="info-item">
            <span style="font-size: 1.2rem;">📍</span>
            <div>
              <strong>Showroom Address</strong>
              WATCHOX Flagship Store, Level 3, Jamuna Future Park, Dhaka, Bangladesh
            </div>
          </div>

          <div class="info-item">
            <span style="font-size: 1.2rem;">📞</span>
            <div>
              <strong>Phone / WhatsApp</strong>
              <span id="contact-phone-val">+880 1700-000000</span>
            </div>
          </div>

          <div class="info-item">
            <span style="font-size: 1.2rem;">✉️</span>
            <div>
              <strong>Email Us</strong>
              support@watchox.com
            </div>
          </div>

          <div class="info-item">
            <span style="font-size: 1.2rem;">🕒</span>
            <div>
              <strong>Working Hours</strong>
              Everyday: 10:00 AM - 10:00 PM
            </div>
          </div>

          <!-- Map Frame Placeholder -->
          <div style="margin-top: 24px; border: 1px solid var(--border-dark); height: 160px; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 0.8rem;">
            🗺️ Interactive Store Map Placeholder
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("contact-phone-val").textContent = WATCHOX_CONFIG.supportPhone;
    });

    function handleContactSubmit(e) {
      e.preventDefault();
      AppEngine.showToast("Thank you! Your message has been sent successfully.");
      document.getElementById("contact-form").reset();
    }
  </script>
</body>
</html>
